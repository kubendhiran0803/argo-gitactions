apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-gitactions
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argo-gitactions
  template:
    metadata:
      labels:
        app: argo-gitactions
    spec:
      containers:
        - name: argo-gitactions
          image: kubendhiran0803/argo-gitactions:041bea20f8f1f0f883c330f6057faf23c1d724ed
          ports:
            - containerPort: 80