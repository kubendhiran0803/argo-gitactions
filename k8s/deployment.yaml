apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-gitactions
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argo-gitactions
  template:
    metadata:
      labels:
        app: argo-gitactions
    spec:
      containers:
        - name: frontend
          image: kubendhiran0803/argo-gitactions:5eb482642653b06ca5ed2e6f13234507b3fad891
          ports:
            - containerPort: 80
