apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-gitactions
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argo-gitactions
  template:
    metadata:
      labels:
        app: argo-gitactions
    spec:
      containers:
        - name: frontend
          image: kubendhiran0803/argo-gitactions:b131efb83eb337258187d992dc969dce1b5dc5d8
          ports:
            - containerPort: 80
