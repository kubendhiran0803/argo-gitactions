apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-gitactions
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argo-gitactions
  template:
    metadata:
      labels:
        app: argo-gitactions
    spec:
      containers:
        - name: argo-gitactions
          image: kubendhiran0803/argo-gitactions:f02e1fc81bf9
          ports:
            - containerPort: 80