apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-gitactions
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kubendhiran0803/argo-gitactions.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
