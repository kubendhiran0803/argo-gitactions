apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: sample-app
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://sample-app.sample-app.svc.cluster.local:80
