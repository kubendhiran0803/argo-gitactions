apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kubendhiran0803/argo-gitactions.git
    targetRevision: HEAD
    path: gitops/apps/sample-app
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true # (If anyone modifies or deletes anything in the 
      # cluster manually without committing to Git, reject their change and 
      # recreate it immediately from Git!")
    syncOptions:
      - CreateNamespace=true

