# Staging overrides for ArgoCD

# Direct argo-cd chart settings
server:
  extraArgs:
    - --insecure
  service:
    type: ClusterIP
    servicePortHttp: 80
    servicePortHttps: 443

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 180s
    application.instanceLabelKey: argocd.argoproj.io/instance
    url: http://localhost:8080
    oidc.config: |
      name: AWS
      issuer: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_74T3Gybvr
      clientID: 57fdab624nge83ng8iq1h02u8r
      clientSecret: $oidc.aws.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
      requestedIDTokenClaims:
        cognito:groups:
          essential: true
  rbac:
    policy.default: role:readonly
    policy.matchMode: glob
    scopes: '[cognito:groups, email]'
    policy.csv: |
      g, ArgoCD-Admins, role:admin
      g, admin@example.com, role:admin
      p, role:developer, applications, get, */*, allow
      p, role:developer, applications, sync, */*, allow
      p, role:developer, logs, get, */*, allow
      g, ArgoCD-Developers, role:developer

controller:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

repoServer:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

dex:
  enabled: false

notifications:
  enabled: false

# Also nested under argo-cd if deployed via wrapper dependency
argo-cd:
  server:
    extraArgs:
      - --insecure
    service:
      type: ClusterIP
      servicePortHttp: 80
      servicePortHttps: 443
  configs:
    params:
      server.insecure: true
    cm:
      timeout.reconciliation: 180s
      application.instanceLabelKey: argocd.argoproj.io/instance
      url: http://localhost:8080
      oidc.config: |
        name: AWS
        issuer: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_74T3Gybvr
        clientID: 57fdab624nge83ng8iq1h02u8r
        clientSecret: $oidc.aws.clientSecret
        requestedScopes:
          - openid
          - profile
          - email
        requestedIDTokenClaims:
          cognito:groups:
            essential: true
    rbac:
      policy.default: role:readonly
      policy.matchMode: glob
      scopes: '[cognito:groups, email]'
      policy.csv: |
        g, ArgoCD-Admins, role:admin
        g, admin@example.com, role:admin
        p, role:developer, applications, get, */*, allow
        p, role:developer, applications, sync, */*, allow
        p, role:developer, logs, get, */*, allow
        g, ArgoCD-Developers, role:developer
  dex:
    enabled: false
  notifications:
    enabled: false

