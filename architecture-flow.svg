<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1380" width="1200" height="1380" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Grid lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- MAIN CANVAS CONTAINER -->
  <rect x="30" y="25" width="1140" height="1330" rx="20" fill="#111827" stroke="#1f2937" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- HEADER -->
  <text x="600" y="70" text-anchor="middle" font-size="24" font-weight="800" fill="url(#headerGrad)" letter-spacing="0.5">End-to-End User Request &amp; Traffic Flow Architecture</text>
  <text x="600" y="96" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">Amazon EKS (v1.30) • GitOps ArgoCD • AWS Application Load Balancer • Diwali Microservice</text>
  <line x1="70" y1="115" x2="1130" y2="115" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ========================================================================= -->
  <!-- 1. USER BROWSER -->
  <!-- ========================================================================= -->
  <g transform="translate(70, 135)">
    <rect width="1060" height="85" rx="12" fill="url(#userGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowCyan)"/>
    <text x="24" y="32" font-size="14" font-weight="700" fill="#38bdf8">💻 1. USER'S BROWSER (Laptop, Friend's Laptop, or Mobile Phone)</text>
    <text x="24" y="56" font-size="12" font-family="'JetBrains Mono', Consolas, monospace" fill="#e2e8f0">
      URL Typed: <tspan fill="#38bdf8" font-weight="700">http://k8s-sampleap-sampleap-1ac8b54bc9-129106128.ap-south-1.elb.amazonaws.com</tspan>
    </text>
    <text x="24" y="74" font-size="11" font-weight="500" fill="#94a3b8">Client initiates standard HTTP connection defaulting to destination <tspan fill="#fbbf24" font-weight="700">Port 80</tspan></text>
  </g>

  <!-- Down Arrow 1 -->
  <line x1="600" y1="220" x2="600" y2="250" stroke="url(#arrowGrad)" stroke-width="2.5"/>
  <polygon points="595,250 605,250 600,258" fill="#0284c7"/>

  <!-- ========================================================================= -->
  <!-- 2. GLOBAL PUBLIC DNS -->
  <!-- ========================================================================= -->
  <g transform="translate(70, 260)">
    <rect width="1060" height="75" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="24" y="30" font-size="14" font-weight="700" fill="#a5b4fc">🌐 2. GLOBAL PUBLIC DNS (Amazon Route 53 / Local ISP Resolver)</text>
    <text x="24" y="54" font-size="12" font-family="'JetBrains Mono', Consolas, monospace" fill="#cbd5e1">
      Resolves 70-character AWS ALB domain name into Public Elastic IPs: <tspan fill="#4ade80" font-weight="700">13.205.14.68</tspan> and <tspan fill="#4ade80" font-weight="700">3.7.208.166</tspan>
    </text>
  </g>

  <!-- Down Arrow 2 -->
  <line x1="600" y1="335" x2="600" y2="365" stroke="url(#arrowGrad)" stroke-width="2.5"/>
  <polygon points="595,365 605,365 600,373" fill="#0284c7"/>

  <!-- ========================================================================= -->
  <!-- 3. AWS CLOUD REGION (ap-south-1 Mumbai) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 375)">
    <rect width="1100" height="945" rx="16" fill="rgba(15, 23, 42, 0.6)" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6"/>
    <rect x="20" y="-12" width="280" height="24" rx="6" fill="#f59e0b"/>
    <text x="160" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#000000" letter-spacing="0.5">☁️ 3. AWS REGION: ap-south-1 (MUMBAI)</text>

    <!-- ======================================================================= -->
    <!-- 4. VPC -->
    <!-- ======================================================================= -->
    <g transform="translate(20, 24)">
      <rect width="1060" height="895" rx="14" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
      <text x="24" y="28" font-size="13" font-weight="700" fill="#fb923c">4. ISOLATED CLOUD NETWORK (VPC: 10.0.0.0/16 — eks-gitops-vpc)</text>
      <rect x="740" y="12" width="295" height="24" rx="6" fill="#f97316"/>
      <text x="887" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#000000">🚪 Internet Gateway (IGW) Attached</text>

      <!-- ===================================================================== -->
      <!-- 5. PUBLIC SUBNET -->
      <!-- ===================================================================== -->
      <g transform="translate(20, 50)">
        <rect width="1020" height="225" rx="12" fill="rgba(16, 185, 129, 0.04)" stroke="#10b981" stroke-width="1.5"/>
        <text x="20" y="26" font-size="12" font-weight="800" fill="#34d399">5. PUBLIC SUBNET (CIDR: 10.0.1.0/24 — Internet-Facing Routing Table)</text>

        <!-- Security Check 1 -->
        <rect x="20" y="40" width="980" height="36" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)"/>
        <text x="36" y="63" font-size="11" font-family="'JetBrains Mono', monospace" fill="#fde68a">
          🔒 <tspan font-weight="700">Security Group Check #1 (ALB SG):</tspan> Inbound TCP Port 80 from 0.0.0.0/0? ──► <tspan fill="#4ade80" font-weight="800">ALLOWED ✅</tspan>
        </text>

        <!-- ALB Box -->
        <g transform="translate(20, 88)">
          <rect width="980" height="118" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="20" y="26" font-size="13" font-weight="700" fill="#38bdf8">⚖️ AWS Application Load Balancer (ALB) — Layer 7 Traffic Distributor</text>
          <text x="20" y="52" font-size="11" font-family="'JetBrains Mono', monospace" fill="#cbd5e1">
            • Receives connection on Public IP: <tspan fill="#38bdf8" font-weight="700">13.205.14.68:80</tspan>
          </text>
          <text x="20" y="74" font-size="11" font-family="'JetBrains Mono', monospace" fill="#cbd5e1">
            • Evaluates Kubernetes Ingress HTTP Rule: <tspan fill="#f59e0b" font-weight="700">Path Prefix "/"</tspan>
          </text>
          <text x="20" y="96" font-size="11" font-family="'JetBrains Mono', monospace" fill="#cbd5e1">
            • Target Group Lookup (Target-Type: IP): Forwards to healthy Pod IP ──► <tspan fill="#4ade80" font-weight="800">10.0.10.216:80</tspan>
          </text>
        </g>
      </g>

      <!-- Down Arrow 3 -->
      <line x1="530" y1="285" x2="530" y2="310" stroke="url(#arrowGrad)" stroke-width="2.5"/>
      <polygon points="525,310 535,310 530,318" fill="#0284c7"/>

      <!-- ===================================================================== -->
      <!-- 6. PRIVATE SUBNET -->
      <!-- ===================================================================== -->
      <g transform="translate(20, 320)">
        <rect width="1020" height="545" rx="12" fill="rgba(99, 102, 241, 0.04)" stroke="#6366f1" stroke-width="1.5"/>
        <text x="20" y="26" font-size="12" font-weight="800" fill="#818cf8">6. PRIVATE SUBNET (CIDR: 10.0.10.0/24 — Isolated Compute Layer, Zero Direct Internet)</text>

        <!-- Security Check 2 -->
        <rect x="20" y="38" width="980" height="36" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)"/>
        <text x="36" y="61" font-size="11" font-family="'JetBrains Mono', monospace" fill="#fde68a">
          🔒 <tspan font-weight="700">Security Group Check #2 (EKS Node SG):</tspan> Inbound traffic on Port 80 from ALB SG? ──► <tspan fill="#4ade80" font-weight="800">ALLOWED ✅</tspan>
        </text>

        <!-- 7. WORKER NODE -->
        <g transform="translate(20, 86)">
          <rect width="980" height="435" rx="12" fill="#111827" stroke="#a855f7" stroke-width="1.5"/>
          <text x="20" y="28" font-size="13" font-weight="700" fill="#c084fc">7. AMAZON EKS MANAGED WORKER NODE (EC2 Instance: t3.small • AL2023)</text>
          
          <!-- VPC CNI -->
          <rect x="20" y="44" width="940" height="40" rx="8" fill="rgba(168, 85, 247, 0.1)" stroke="#a855f7" stroke-dasharray="4,4"/>
          <text x="36" y="68" font-size="11" font-family="'JetBrains Mono', monospace" fill="#e9d5ff">
            ⚡ <tspan font-weight="700">AWS VPC CNI Plugin:</tspan> Directs packet from EC2 Elastic Network Interface directly to Container IP namespace.
          </text>

          <!-- Down Arrow 4 -->
          <line x1="490" y1="92" x2="490" y2="114" stroke="#a855f7" stroke-width="2"/>
          <polygon points="486,114 494,114 490,120" fill="#a855f7"/>

          <!-- 8. POD CONTAINER -->
          <g transform="translate(20, 126)">
            <rect width="940" height="285" rx="10" fill="rgba(14, 165, 233, 0.06)" stroke="#0284c7" stroke-width="1.5"/>
            <text x="24" y="30" font-size="13" font-weight="700" fill="#38bdf8">8. DIWALI APPLICATION POD (Kubernetes Namespace: sample-app)</text>
            <rect x="760" y="14" width="156" height="22" rx="4" fill="#0284c7"/>
            <text x="838" y="29" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">NGINX ALPINE CONTAINER</text>

            <rect x="24" y="48" width="892" height="1" fill="rgba(255,255,255,0.08)"/>

            <text x="24" y="78" font-size="12" font-family="'JetBrains Mono', monospace" fill="#f8fafc">
              • Pod Private Network IP: <tspan fill="#38bdf8" font-weight="700">10.0.10.216:80</tspan>
            </text>
            <text x="24" y="106" font-size="12" font-family="'JetBrains Mono', monospace" fill="#f8fafc">
              • Active Web Process: <tspan fill="#fbbf24">nginx -g 'daemon off;' (Listening on Port 80)</tspan>
            </text>
            <text x="24" y="134" font-size="12" font-family="'JetBrains Mono', monospace" fill="#f8fafc">
              • Static Assets Root: <tspan fill="#cbd5e1">/usr/share/nginx/html</tspan>
            </text>
            
            <!-- Files Box -->
            <g transform="translate(24, 150)">
              <rect width="892" height="60" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.1)"/>
              <text x="20" y="24" font-size="11" font-family="'JetBrains Mono', monospace" fill="#38bdf8">├── index.html  <tspan fill="#94a3b8">(Login Page, Personalized Greeting, Diwali Cracker DOM)</tspan></text>
              <text x="20" y="42" font-size="11" font-family="'JetBrains Mono', monospace" fill="#a855f7">├── style.css   <tspan fill="#94a3b8">(Festive Deepavali Glowing Animations, Glassmorphism)</tspan></text>
              <text x="20" y="58" font-size="11" font-family="'JetBrains Mono', monospace" fill="#4ade80">└── app.js      <tspan fill="#94a3b8">(111009 Tricky Password, Web Audio Synthesizer, Canvas Fireworks)</tspan></text>
            </g>

            <rect x="24" y="226" width="892" height="42" rx="8" fill="rgba(74, 222, 128, 0.1)" stroke="#4ade80"/>
            <text x="470" y="252" text-anchor="middle" font-size="13" font-weight="800" fill="#4ade80">
              🎉 HTTP 200 OK — Delivered Back to User Screen in 42ms!
            </text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>

