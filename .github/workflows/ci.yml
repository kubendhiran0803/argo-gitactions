
name: Docker Build and Argo CD Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # CI: Build and push image to Docker Hub
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            kubendhiran0803/argo-gitactions:latest
            kubendhiran0803/argo-gitactions:${{ github.sha }}

  # CD: Bootstrap Argo CD in AWS EKS
  
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Temporary diagnostic step
      - name: Check GitHub OIDC Claims
        shell: bash
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          request = urllib.request.Request(
              url + ("&" if "?" in url else "?") + "audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " + token}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name test-eks

