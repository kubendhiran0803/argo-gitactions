
name: Docker Build and Argo CD Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            kubendhiran0803/argo-gitactions:latest
            kubendhiran0803/argo-gitactions:${{ github.sha }}

      - name: Update Kubernetes Deployment Image
        run: |
          sed -i "s|image: kubendhiran0803/argo-gitactions:.*|image: kubendhiran0803/argo-gitactions:${{ github.sha }}|" k8s/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Update image to ${{ github.sha }}"
            git push origin HEAD:main
          fi
