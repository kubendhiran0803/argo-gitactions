name: "Terraform GitOps Pipeline"

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      layer:
        description: "Terraform layer to target"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "base"
          - "infra"
      action:
        description: "Action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - "apply"
          - "plan"
          - "destroy"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: "ap-south-1"
  TF_VERSION: "1.10.0"

jobs:
  terraform-base:
    name: "Terraform Base (Network)"
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.layer == 'base' ||
      github.event.inputs.layer == 'all'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/base

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Access Key / Secret Key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend-config=backend-staging.hcl

      - name: Terraform Plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
        run: terraform plan -no-color

      - name: Terraform Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve

  terraform-infra:
    name: "Terraform Infra (Platform & ArgoCD)"
    needs: [terraform-base]
    if: |
      always() &&
      (needs.terraform-base.result == 'success' || needs.terraform-base.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.layer == 'infra' || github.event.inputs.layer == 'all')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/infra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Access Key / Secret Key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend-config=backend-staging.hcl

      - name: Terraform Plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
        run: terraform plan -no-color

      - name: Terraform Apply (Stages 2 & 3: EKS + ArgoCD)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve

      - name: Setup Kubectl
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        uses: azure/setup-kubectl@v4

      - name: Bootstrap GitOps Root App (Stage 4)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          echo "Configuring kubeconfig for EKS cluster..."
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name eks-gitops-staging
          
          echo "Waiting for ArgoCD API server to be available..."
          kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s || true
          
          echo "Applying Stage 4 GitOps Root App..."
          kubectl apply -f ../../gitops/root-app.yaml
          echo "ArgoCD Root App deployed! GitOps controller is now orchestrating the environment."

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve

